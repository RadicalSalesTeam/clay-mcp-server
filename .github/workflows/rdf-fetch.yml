name: rdf-fetch
on:
  push:
    branches: ['claude/dlugosz-meble-financials-3akvy3']
    paths: ['tools/rdf/**', '.github/workflows/rdf-fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: curl -sS -m 30 -o /dev/null -w "root %{http_code}\n" https://rdf-przegladarka.ms.gov.pl/ || true
      - run: node tools/rdf/fetch.js 0000369638
        continue-on-error: true
      - name: commit output
        run: |
          git config user.name "rdf-bot"; git config user.email "rdf-bot@users.noreply.github.com"
          git add -f rdf-out || true
          git commit -m "rdf-fetch output [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
